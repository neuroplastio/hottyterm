# gov R-22: hotty-blitz's main against the tip of R-22's kept hotty-blitz
# chain, which keeps what every new document paid for again. On
# r22/blitz-cache: the scratch document takes no stylesheet, a system font
# loads once, the user agent stylesheet is parsed once and the system's
# fallback font is asked for once. On r22/blitz-sheets: a font query keeps
# what the last one matched, which halves the resolve of plx's dialog box
# (a parley layout per cell). In plx's palette, a document new at every
# opening, a later opening went from 77/94 to 75/78 ms (p50/p95) and plx
# palette-docs' first from 99 to 89. The after side moves to each fix in the
# chain that is kept, until the maintainer opens the pair. Both sides are
# hottyterm built the same way (scripts/compare-build.sh), at 11528ab, with
# hotty-blitz at the chain's tip or at its merge-base, and run the installed
# plx, as the maintainer works.
brief = "Use plx's palette (:) a few times, and its dialogs: does A or B open them sooner?"
track = "R-22"
results = "docs/feel.md"
hottyterm = "$SIDE_DIR/bin/hottyterm"
seed = ["config/plx", "config/fish"]

[before]
label = "hotty-blitz main (r22/blitz-cache's merge-base), in hottyterm main"
build = '"$COMPARE_REPO/scripts/compare-build.sh" main "$(git -C "$NEUROPLASTIO/hotty-blitz/main" merge-base main r22/blitz-cache)"'
run = "exec plx"

[after]
label = "hotty-blitz r22/blitz-sheets a96a8ca (r22/blitz-cache, and font queries that keep their matches), in hottyterm main"
build = '"$COMPARE_REPO/scripts/compare-build.sh" 11528ab a96a8ca'
run = "exec plx"
