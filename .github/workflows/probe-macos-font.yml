# Draws 😀 with CoreText from sbix variants of Noto Color Emoji
# (scripts/probe-macos-font.py), to find one CoreText draws. No hottyterm
# build is involved. On demand only:
#
#   gh workflow run probe-macos-font.yml
name: probe-macos-font

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Fonts
        run: |
          mkdir -p fonts
          curl -sSfLo fonts/NotoColorEmoji.ttf https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  fonts/NotoColorEmoji.ttf" | shasum -a 256 -c
          curl -sSfLo fonts/openmoji.zip https://github.com/hfg-gmuend/openmoji/releases/download/17.0.0/openmoji-font.zip
          (cd fonts && unzip -q openmoji.zip 'OpenMoji-color-sbix/*')

      - name: Probe
        run: |
          python3 -m venv venv
          venv/bin/pip install -q fonttools==4.68.0 pyobjc-framework-CoreText pyobjc-framework-Quartz
          venv/bin/python scripts/probe-macos-font.py fonts/NotoColorEmoji.ttf fonts/OpenMoji-color-sbix/OpenMoji-color-sbix.ttf out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-macos-font
          path: out/*.png
          retention-days: 3
