# Builds hottyterm.app for Apple silicon (scripts/build-macos.sh): hotty-blitz
# as a static library inside GhosttyKit, then the app with Xcode 26.
#
# macOS minutes are expensive on a private repository, so this runs when the
# fork's inputs change on main, and on demand, not on every push.
#
# hotty-blitz is private: HOTTY_BLITZ_DEPLOY_KEY is a read-only deploy key on
# neuroplastio/hotty-blitz.
name: macos

on:
  push:
    branches: [main]
    paths:
      - ghostty-ref
      - patches/**
      - brand/**
      - scripts/brand.py
      - scripts/fork.sh
      - scripts/build-macos.sh
      - .github/workflows/macos.yml
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig-cache/local
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig-cache/global
  GIT_AUTHOR_NAME: hottyterm CI
  GIT_AUTHOR_EMAIL: noreply@github.com
  GIT_COMMITTER_NAME: hottyterm CI
  GIT_COMMITTER_EMAIL: noreply@github.com

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: hottyterm/main

      - uses: actions/checkout@v7
        with:
          repository: neuroplastio/hotty-blitz
          path: hotty-blitz/main
          ssh-key: ${{ secrets.HOTTY_BLITZ_DEPLOY_KEY }}

      - name: Xcode
        run: xcodebuild -version

      - name: mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchains
        run: |
          mise trust hottyterm/main/mise.toml
          mise trust hotty-blitz/main/mise.toml
          (cd hottyterm/main && mise install)
          (cd hotty-blitz/main && mise install rust)

      - name: Restore caches
        uses: actions/cache/restore@v5
        with:
          path: |
            hotty-blitz/main/target/release
            ~/.cargo/registry
            zig-cache
          key: macos-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-${{ github.sha }}
          restore-keys: |
            macos-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-
            macos-

      - name: Fork
        run: hottyterm/main/scripts/fork.sh

      - name: Build
        run: hottyterm/main/scripts/build-macos.sh

      - name: Save caches
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            hotty-blitz/main/target/release
            ~/.cargo/registry
            zig-cache
          key: macos-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-${{ github.sha }}

      # Signed ad hoc: macOS will ask to confirm the first launch
      # (right-click, Open).
      - name: Package
        run: ditto -c -k --keepParent hottyterm/main/out/hottyterm.app hottyterm-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: hottyterm-macos-arm64
          path: hottyterm-macos-arm64.zip
          retention-days: 7
