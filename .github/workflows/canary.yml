# Daily: do the patches still apply to upstream Ghostty's main, and does the
# branding still find its anchors? A failure here is the early warning that
# moving ghostty-ref will need work (README, "Changing the fork").
name: canary

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: hottyterm CI
  GIT_AUTHOR_EMAIL: noreply@github.com
  GIT_COMMITTER_NAME: hottyterm CI
  GIT_COMMITTER_EMAIL: noreply@github.com

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: hottyterm/main
      - run: make -C hottyterm/main canary
