# hottyterm's CI, one workflow:
#
# - linux: every push and pull request. In an Arch Linux container (the
#   distribution hottyterm is developed on): the patches apply to
#   ghostty-ref, the branding finds its anchors, and the fork builds against
#   hotty-blitz at the commit in hotty-blitz-ref. The smoke test needs a
#   display and a GPU and stays local.
# - macos: hottyterm.app for Apple silicon (scripts/build-macos.sh). Macs
#   are the scarcest runners, so it runs when a push to main changes the
#   fork's inputs (the `changes` job decides), and on demand, not on every
#   push.
# - canary: daily, and on demand. Do the patches still apply to upstream
#   Ghostty's main, and does the branding still find its anchors?
# - release: on main, when both builds ran and passed, a GitHub prerelease
#   of the artifacts. Versions are CalVer like the other neuroplastio
#   projects: the commit's UTC date and short commit, 26.09.29-dev.1e81d70.
# - homebrew: after a release, its macOS app as a cask in the org tap
#   (packaging/homebrew), with the tap's deploy key.
# - aur: after a release, its Linux build as the AUR package hottyterm-bin
#   (packaging/aur), with a key of the AUR account.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # fork.sh commits the patches and the branding in the fork.
  GIT_AUTHOR_NAME: hottyterm CI
  GIT_AUTHOR_EMAIL: noreply@github.com
  GIT_COMMITTER_NAME: hottyterm CI
  GIT_COMMITTER_EMAIL: noreply@github.com

jobs:
  # Does this push change what the macOS app is built from?
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fork: ${{ steps.diff.outputs.fork }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          inputs='^(ghostty-ref|hotty-blitz-ref|patches/|brand/|notices/|scripts/(brand\.py|fork\.sh|build-macos\.sh|notices\.py)|\.github/workflows/ci\.yml)'
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            fork=true   # a new branch, or history rewritten: build
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$inputs"; then
            fork=true
          else
            fork=false
          fi
          echo "fork=$fork" >> "$GITHUB_OUTPUT"

  linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Arch's official image from ghcr.io: Docker Hub rate-limits GitHub's runners.
    container: ghcr.io/archlinux/archlinux:latest
    timeout-minutes: 90
    outputs:
      blitz: ${{ steps.blitz.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh curl unzip \
            gtk4 gtk4-layer-shell libadwaita wayland libx11 fontconfig \
            python-gobject gettext patchelf

      - uses: actions/checkout@v7
        with:
          path: hottyterm/main

      - id: pin
        run: echo "blitz=$(grep -v '^#' hottyterm/main/hotty-blitz-ref | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: neuroplastio/hotty-blitz
          ref: ${{ steps.pin.outputs.blitz }}
          path: hotty-blitz/main

      - id: blitz
        run: echo "sha=$(git -C hotty-blitz/main rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # mise-action installs mise and caches what it installs. The tools
      # come from each repository's mise.toml (Zig here, Rust in
      # hotty-blitz), so the key covers both and the installs are ours.
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache_key: mise-${{ runner.os }}-${{ hashFiles('hottyterm/main/mise.toml', 'hotty-blitz/main/mise.toml') }}

      - name: Toolchains
        run: |
          mise trust hottyterm/main/mise.toml
          mise trust hotty-blitz/main/mise.toml
          (cd hottyterm/main && mise install)
          (cd hotty-blitz/main && mise install rust)

      # Restored and saved as two steps, the save also after a failure, so a
      # build that fails late still keeps what it compiled. Not after a
      # cancel: that would hold up the run that replaced this one.
      - name: Restore caches
        uses: actions/cache/restore@v5
        with:
          path: |
            hotty-blitz/main/target/release
            ~/.cargo/registry
            ~/.cache/zig
          key: linux-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-${{ github.sha }}
          restore-keys: |
            linux-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-
            linux-

      # -Dcpu=baseline (Ghostty's PACKAGING.md): zig build targets the
      # machine it runs on by default, and a runner's CPU can have what the
      # user's lacks. 26.10.02-dev.5abc98b was built with AVX512-FP16 and
      # died with SIGILL on a Zen 5 laptop.
      - name: Build
        run: make -C hottyterm/main apply build ZIG_ARGS=-Dcpu=baseline

      - name: Save caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: |
            hotty-blitz/main/target/release
            ~/.cargo/registry
            ~/.cache/zig
          key: linux-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-${{ github.sha }}

      # bin/hottyterm finds lib/libhotty_blitz.so through its $ORIGIN rpath,
      # and through nothing else: the build also gives it hotty-blitz's
      # target directory, for a run from zig-out, which is this runner's path
      # and nobody's install. The licence and the third-party notices go at
      # the top.
      - name: Package
        run: |
          mkdir -p dist/hottyterm/lib
          cp -R hottyterm/ghostty/zig-out/. dist/hottyterm/
          cp hotty-blitz/main/target/release/libhotty_blitz.so dist/hottyterm/lib/
          # shellcheck disable=SC2016 # the loader's $ORIGIN, not the shell's
          rpath='$ORIGIN/../lib'
          patchelf --set-rpath "$rpath" dist/hottyterm/bin/hottyterm
          test "$(patchelf --print-rpath dist/hottyterm/bin/hottyterm)" = "$rpath"
          cp hottyterm/main/LICENSE dist/hottyterm/LICENSE
          python3 hottyterm/main/scripts/notices.py --platform linux-x86_64 \
            --target x86_64-unknown-linux-gnu --fork hottyterm/ghostty --blitz hotty-blitz/main \
            -o dist/hottyterm/THIRD-PARTY-NOTICES.txt
          tar -C dist -czf hottyterm-linux-x86_64.tar.gz hottyterm

      - uses: actions/upload-artifact@v7
        with:
          name: hottyterm-linux-x86_64
          path: hottyterm-linux-x86_64.tar.gz
          retention-days: 7

  macos:
    needs: changes
    # always(): `changes` is skipped on workflow_dispatch.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.fork == 'true')
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      blitz: ${{ steps.blitz.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig-cache/local
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig-cache/global
    steps:
      - uses: actions/checkout@v7
        with:
          path: hottyterm/main

      - id: pin
        run: echo "blitz=$(grep -v '^#' hottyterm/main/hotty-blitz-ref | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: neuroplastio/hotty-blitz
          ref: ${{ steps.pin.outputs.blitz }}
          path: hotty-blitz/main

      - id: blitz
        run: echo "sha=$(git -C hotty-blitz/main rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Xcode
        run: xcodebuild -version

      # mise-action installs mise and caches what it installs. The tools
      # come from each repository's mise.toml (Zig here, Rust in
      # hotty-blitz), so the key covers both and the installs are ours.
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache_key: mise-${{ runner.os }}-${{ hashFiles('hottyterm/main/mise.toml', 'hotty-blitz/main/mise.toml') }}

      - name: Toolchains
        run: |
          mise trust hottyterm/main/mise.toml
          mise trust hotty-blitz/main/mise.toml
          (cd hottyterm/main && mise install)
          (cd hotty-blitz/main && mise install rust)

      - name: Restore caches
        uses: actions/cache/restore@v5
        with:
          path: |
            hotty-blitz/main/target/release
            ~/.cargo/registry
            zig-cache
          key: macos-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-${{ github.sha }}
          restore-keys: |
            macos-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-
            macos-

      - name: Fork
        run: hottyterm/main/scripts/fork.sh

      - name: Build
        run: hottyterm/main/scripts/build-macos.sh

      - name: Save caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: |
            hotty-blitz/main/target/release
            ~/.cargo/registry
            zig-cache
          key: macos-${{ hashFiles('hotty-blitz/main/Cargo.lock', 'hottyterm/main/ghostty-ref', 'hottyterm/main/patches/*') }}-${{ github.sha }}

      # Signed ad hoc: macOS blocks the first launch until it is allowed in
      # System Settings, Privacy & Security.
      - name: Package
        run: ditto -c -k --keepParent hottyterm/main/out/hottyterm.app hottyterm-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: hottyterm-macos-arm64
          path: hottyterm-macos-arm64.zip
          retention-days: 7

  # A GitHub prerelease of both builds. Created as a draft and published
  # last, so a run cancelled halfway leaves no half-uploaded release.
  release:
    needs: [changes, linux, macos]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.linux.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          echo "version=$(TZ=UTC git show -s --date=format-local:%y.%m.%d --format=%cd HEAD)-dev.$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "ghostty=$(grep -v '^#' ghostty-ref | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          # Each build's notices, also as a file of their own.
          tar -xzf hottyterm-linux-x86_64.tar.gz -O hottyterm/THIRD-PARTY-NOTICES.txt \
            > "hottyterm-$VERSION-linux-x86_64-THIRD-PARTY-NOTICES.txt"
          unzip -p hottyterm-macos-arm64.zip hottyterm.app/Contents/Resources/THIRD-PARTY-NOTICES.txt \
            > "hottyterm-$VERSION-macos-arm64-THIRD-PARTY-NOTICES.txt"
          mv hottyterm-linux-x86_64.tar.gz "hottyterm-$VERSION-linux-x86_64.tar.gz"
          mv hottyterm-macos-arm64.zip "hottyterm-$VERSION-macos-arm64.zip"
          sha256sum hottyterm-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          GHOSTTY: ${{ steps.version.outputs.ghostty }}
          BLITZ_LINUX: ${{ needs.linux.outputs.blitz }}
          BLITZ_MACOS: ${{ needs.macos.outputs.blitz }}
        run: |
          blitz="neuroplastio/hotty-blitz@${BLITZ_LINUX:0:7}"
          [ "$BLITZ_LINUX" = "$BLITZ_MACOS" ] || blitz="$blitz (Linux), @${BLITZ_MACOS:0:7} (macOS)"
          cat > notes.md <<NOTES
          hottyterm is a fork of Ghostty with native HOTTY (HTML over the TTY), a proof of concept of the protocol. It is not affiliated with Ghostty.

          Built from:
          - hottyterm ${GITHUB_SHA:0:7}
          - Ghostty ${GHOSTTY:0:8}, plus \`patches/\` and the generated branding
          - $blitz

          Assets:
          - \`hottyterm-$VERSION-linux-x86_64.tar.gz\`: \`bin/\`, \`share/\` and \`lib/libhotty_blitz.so\`. Needs GTK 4, libadwaita and gtk4-layer-shell. On Arch Linux, the AUR package \`hottyterm-bin\`.
          - \`hottyterm-$VERSION-macos-arm64.zip\`: \`hottyterm.app\` for Apple silicon, signed ad hoc: macOS blocks the first launch until it is allowed in System Settings, Privacy & Security ("Open Anyway"). Also \`brew install --cask neuroplastio/tap/hottyterm\`.
          - \`hottyterm-$VERSION-*-THIRD-PARTY-NOTICES.txt\`: the licences of everything each build contains (also inside the archive and the app).
          - \`SHA256SUMS\`
          NOTES
          gh release create "$VERSION" --draft --prerelease --target "$GITHUB_SHA" \
            --title "hottyterm $VERSION" --notes-file notes.md dist/*
          gh release edit "$VERSION" --draft=false

  # The Homebrew cask, rendered from the release's macOS app and pushed to
  # the org tap `neuroplastio/homebrew-tap` (packaging/homebrew/publish.sh).
  # The tap is another repository: HOMEBREW_TAP_DEPLOY_KEY is the private
  # half of a deploy key on it that may write, and nothing else. Without it
  # the job skips, as kubecom's does.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Publish
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set; skipping the Homebrew publish"
            exit 0
          fi
          packaging/homebrew/publish.sh "$VERSION" --push

  # The AUR package hottyterm-bin, rendered from the release's Linux build
  # and pushed to the AUR (packaging/aur/publish.sh), once makepkg has built
  # it as a user's would. makepkg refuses to run as root, so the job runs it
  # as a user of its own in an Arch container. AUR_SSH_PRIVATE_KEY is a key
  # of the AUR account the package belongs to; without it the job skips, as
  # kubecom's does.
  aur:
    needs: release
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:base-devel
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # git before the checkout, so that it is a clone: the package's version
      # counts the commits up to the release's.
      - name: Packages
        run: pacman -Syu --noconfirm --needed git openssh curl libarchive zstd

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR publish"
            exit 0
          fi
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "packaging/aur/publish.sh '$VERSION' --push"

  # A failure here is the early warning that moving ghostty-ref will need
  # work (README, "Changing the fork").
  canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: hottyterm/main
      - run: make -C hottyterm/main canary
