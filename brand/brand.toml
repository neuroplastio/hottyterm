# hottyterm's branding, applied to the fork by scripts/brand.py as one
# generated commit on top of patches/. It is regenerated, never rebased, so
# pulling in upstream costs nothing here unless an anchor below moved; then
# brand.py says which one, and the fix is a line in this file.
#
# What changes is what a user sees as the product: the name, the icon, the
# application id (Linux: window class, D-Bus name, desktop entry,
# notifications; macOS: bundle id), the executable, the About dialog, and
# user-facing strings, on Linux and macOS. The macOS app also stops looking
# for updates: Ghostty's update feed would replace it with Ghostty. What stays
# is what programs and configs rely on to work with Ghostty: TERM=xterm-ghostty,
# TERM_PROGRAM, GHOSTTY_* variables, the config file, the resources directory
# (share/ghostty), and internal identifiers (notification names, keys).
#
# Placeholders in `to`: @name@, @app_id@, @exe@, @url@.

[identity]
name = "hottyterm"
app_id = "io.github.neuroplastio.hottyterm"
exe = "hottyterm"
url = "https://github.com/neuroplastio/hottyterm"

# Images from brand/icons (scripts/brand-icons.sh) replace upstream's. `to`
# entries are globs; each must match at least one file. {n} is each size.
[[copy]]
from = "icons/{n}.png"
sizes = [16, 32, 64, 128, 256, 512, 1024, 2048]
to = ["images/gnome/{n}.png", "images/gnome/nightly-{n}.png"]

[[copy]]
from = "icons/1024.png"
to = ["macos/Assets.xcassets/AppIconImage.imageset/macOS-AppIcon-1024px.png",
      "macos/Assets.xcassets/Alternate Icons/*.imageset/macOS-AppIcon-1024px.png"]

[[copy]]
from = "icons/512.png"
to = ["macos/Assets.xcassets/AppIconImage.imageset/macOS-AppIcon-512px.png"]

[[copy]]
from = "icons/256.png"
to = ["macos/Assets.xcassets/AppIconImage.imageset/macOS-AppIcon-256px-128pt@2x.png"]

# The macOS app icon is an Icon Composer bundle; its layer becomes the mark
# (the overlay's icon.json draws it on the dark ground).
[[copy]]
from = "icons/mark-824.png"
to = ["images/Ghostty.icon/Assets/Ghostty.png"]

# Every file under brand/overlay/ replaces the file at the same path.

# --- identity in the build ------------------------------------------------

[[replace]]
file = "src/build_config.zig"
from = 'pub const bundle_id = "com.mitchellh.ghostty";'
to = 'pub const bundle_id = "@app_id@";'

[[replace]]
file = "src/apprt/gtk/build/info.zig"
from = 'pub const base_application_id = "com.mitchellh.ghostty";'
to = 'pub const base_application_id = "@app_id@";'

[[replace]]
file = "src/build/GhosttyI18n.zig"
from = 'const domain = "com.mitchellh.ghostty";'
to = 'const domain = "@app_id@";'

[[replace]]
file = "src/build/GhosttyExe.zig"
from = '.name = "ghostty",'
to = '.name = "@exe@",'

[[replace]]
file = "src/build/GhosttyResources.zig"
from = 'b.fmt("Ghostty{s}"'
to = 'b.fmt("@name@{s}"'

[[replace]]
file = "src/build/GhosttyResources.zig"
from = 'b.fmt("com.mitchellh.ghostty{s}"'
to = 'b.fmt("@app_id@{s}"'

[[replace]]
file = "src/build/GhosttyResources.zig"
from = '"{s}/bin/ghostty"'
to = '"{s}/bin/@exe@"'

[[replace]]
file = "src/build/GhosttyResources.zig"
from = 'apps/com.mitchellh.ghostty.png'
to = 'apps/@app_id@.png'
count = "any"

[[replace]]
file = "src/build/GhosttyResources.zig"
from = 'servicemenus/com.mitchellh.ghostty.desktop'
to = 'servicemenus/@app_id@.desktop'

# --- the GTK app ----------------------------------------------------------

[[replace]]
file = "src/apprt/gtk/class/window.zig"
from = 'return glib.ext.dupeZ(u8, "Ghostty");'
to = 'return glib.ext.dupeZ(u8, "@name@");'

[[replace]]
file = "src/apprt/gtk/class/window.zig"
from = 'const name = "Ghostty";'
to = 'const name = "@name@";'

[[replace]]
file = "src/apprt/gtk/class/window.zig"
from = 'const icon = "com.mitchellh.ghostty";'
to = 'const icon = "@app_id@";'

[[replace]]
file = "src/apprt/gtk/class/window.zig"
from = 'const website = "https://ghostty.org";'
to = 'const website = "@url@";'

[[replace]]
file = "src/apprt/gtk/class/window.zig"
from = '"https://github.com/ghostty-org/ghostty/issues"'
to = '"@url@/issues"'

[[replace]]
file = "src/apprt/gtk/class/window.zig"
from = 'i18n._("Ghostty Developers")'
to = 'i18n._("The @name@ authors, based on Ghostty")'

[[replace]]
file = "src/apprt/gtk/class/tab.zig"
from = 'const default = "Ghostty";'
to = 'const default = "@name@";'

[[replace]]
file = "src/apprt/gtk/class/application.zig"
from = '0 => "Ghostty",'
to = '0 => "@name@",'

[[replace]]
file = "src/apprt/gtk/class/application.zig"
from = 'gio.ThemedIcon.new("com.mitchellh.ghostty")'
to = 'gio.ThemedIcon.new("@app_id@")'

[[replace]]
file = "src/apprt/gtk/class/surface.zig"
from = 'gio.ThemedIcon.new("com.mitchellh.ghostty")'
to = 'gio.ThemedIcon.new("@app_id@")'

[[replace]]
file = "src/apprt/gtk/class/surface.zig"
from = '0 => "Ghostty",'
to = '0 => "@name@",'

[[replace]]
file = "src/apprt/gtk/ui/1.0/clipboard-confirmation-dialog.blp"
from = 'there is a bug in Ghostty. Please report it.'
to = 'there is a bug in @name@. Please report it.'

[[replace]]
file = "src/apprt/gtk/ui/1.4/clipboard-confirmation-dialog.blp"
from = 'there is a bug in Ghostty. Please report it.'
to = 'there is a bug in @name@. Please report it.'

[[replace]]
file = "src/apprt/gtk/ui/1.5/inspector-window.blp"
from = 'icon-name: "com.mitchellh.ghostty";'
to = 'icon-name: "@app_id@";'

[[replace]]
file = "src/apprt/gtk/class/surface_child_exited.zig"
from = '"This is a bug in Ghostty. Please report it."'
to = '"This is a bug in @name@. Please report it."'

[[replace]]
file = "src/apprt/gtk/ui/1.3/surface-child-exited.blp"
from = 'title: "This is a bug in Ghostty. Please report it.";'
to = 'title: "This is a bug in @name@. Please report it.";'

# The palette command that types a ghost keeps the ghost, not the name.
[[replace]]
file = "src/input/command.zig"
from = 'i18n.N_("Put a little Ghostty in your terminal.")'
to = 'i18n.N_("Put a little ghost in your terminal.")'

[[replace]]
file = "src/input/command.zig"
from = '.title = i18n.N_("Ghostty"),'
to = '.title = i18n.N_("Ghost"),'

[[replace]]
file = "src/cli/version.zig"
from = 'try stdout.print("Ghostty {s}\n\n"'
to = 'try stdout.print("@name@ {s}, a fork of Ghostty\n\n"'

# --- desktop integration --------------------------------------------------

[[replace]]
file = "dist/linux/app.desktop.in"
from = 'Icon=com.mitchellh.ghostty'
to = 'Icon=@app_id@'

[[replace]]
file = "dist/linux/ghostty_dolphin.desktop"
from = 'Name=Open Ghostty Here'
to = 'Name=Open @name@ Here'

[[replace]]
file = "dist/linux/ghostty_dolphin.desktop"
from = 'Icon=com.mitchellh.ghostty'
to = 'Icon=@app_id@'

[[replace]]
file = "dist/linux/ghostty_dolphin.desktop"
from = 'Exec=ghostty '
to = 'Exec=@exe@ '

[[replace]]
file = "dist/linux/ghostty_nautilus.py"
from = 'DOMAIN = "com.mitchellh.ghostty"'
to = 'DOMAIN = "@app_id@"'

[[replace]]
file = "dist/linux/ghostty_nautilus.py"
from = "cmd = ['ghostty',"
to = "cmd = ['@exe@',"

[[replace]]
file = "dist/linux/ghostty_nautilus.py"
from = "_('Open in Ghostty')"
to = "_('Open in @name@')"

[[replace]]
file = "dist/linux/ghostty_nautilus.py"
from = "icon='com.mitchellh.ghostty'"
to = "icon='@app_id@'"

# --- the macOS app --------------------------------------------------------

[[replace]]
file = "macos/Ghostty.xcodeproj/project.pbxproj"
from = 'PRODUCT_BUNDLE_IDENTIFIER = com.mitchellh.ghostty;'
to = 'PRODUCT_BUNDLE_IDENTIFIER = @app_id@;'
count = 2

[[replace]]
file = "macos/Ghostty.xcodeproj/project.pbxproj"
from = 'PRODUCT_BUNDLE_IDENTIFIER = com.mitchellh.ghostty.debug;'
to = 'PRODUCT_BUNDLE_IDENTIFIER = @app_id@.debug;'

[[replace]]
file = "macos/Ghostty.xcodeproj/project.pbxproj"
from = 'PRODUCT_BUNDLE_IDENTIFIER = "com.mitchellh.ghostty-dock-tile";'
to = 'PRODUCT_BUNDLE_IDENTIFIER = "@app_id@-dock-tile";'
count = 3

[[replace]]
file = "macos/Ghostty.xcodeproj/project.pbxproj"
from = 'INFOPLIST_KEY_CFBundleDisplayName = Ghostty;'
to = 'INFOPLIST_KEY_CFBundleDisplayName = @name@;'
count = 2

[[replace]]
file = "macos/Ghostty.xcodeproj/project.pbxproj"
from = 'INFOPLIST_KEY_CFBundleDisplayName = "Ghostty[DEBUG]";'
to = 'INFOPLIST_KEY_CFBundleDisplayName = "@name@[DEBUG]";'

[[replace]]
file = "macos/Ghostty.xcodeproj/project.pbxproj"
from = 'INFOPLIST_KEY_CFBundleDisplayName = "Ghostty Dock Tile Plugin";'
to = 'INFOPLIST_KEY_CFBundleDisplayName = "@name@ Dock Tile Plugin";'
count = 3

# CFBundleName, which the menu bar shows, is the product name, and Xcode
# overrides it in Info.plist; renaming the product would break Interface
# Builder's module references. scripts/build-macos.sh sets it in the built
# app instead.

[[replace]]
file = "macos/Ghostty-Info.plist"
from = '<string>Ghostty Surface Identifier</string>'
to = '<string>@name@ Surface Identifier</string>'

# The Dock tile plugin reads the app's defaults, found by its bundle id.
[[replace]]
file = "macos/Sources/Features/Custom App Icon/DockTilePlugin.swift"
from = 'UserDefaults(suiteName: "com.mitchellh.ghostty.debug")'
to = 'UserDefaults(suiteName: "@app_id@.debug")'

[[replace]]
file = "macos/Sources/Features/Custom App Icon/DockTilePlugin.swift"
from = 'UserDefaults(suiteName: "com.mitchellh.ghostty")'
to = 'UserDefaults(suiteName: "@app_id@")'

# No updates: Ghostty's feed would replace hottyterm with Ghostty.
[[replace]]
file = "macos/Sources/Features/Update/UpdateDelegate.swift"
from = 'case .tip: return "https://tip.files.ghostty.org/appcast.xml"'
to = 'case .tip: return nil'

[[replace]]
file = "macos/Sources/Features/Update/UpdateDelegate.swift"
from = 'case .stable: return "https://release.files.ghostty.org/appcast.xml"'
to = 'case .stable: return nil'

# --- user-facing strings, without anchors ---------------------------------

# Inside each string `literal` matches (group 2 is its content), `word`
# (default: the word Ghostty) becomes the name. New strings upstream adds are
# covered without a rule. The price: a string that names Ghostty and is
# really a key or an asset name would be renamed too. None exist at
# ghostty-ref; a Swift one would show up as a missing asset or setting.

# Translatable strings: _("…"), i18n._("…"), i18n.N_("…").
[[strings]]
globs = ["src/**/*.zig", "src/**/*.blp"]
literal = '((?:\bi18n\.N_|\bi18n\._|(?<![\w.])_)\(")((?:[^"\\\n]|\\.)*)(")'

# Swift string literals. `Ghostty.` followed by a letter is code or a file
# name (\(Ghostty.Shell…), Ghostty.icns), not the product.
[[strings]]
globs = ["macos/Sources/**/*.swift"]
literal = '(")((?:[^"\\\n]|\\.)*)(")'
word = '(?<!\()\bGhostty\b(?!\.\w)'

# Menu titles (and Interface Builder's own labels) in .xib files.
[[strings]]
globs = ["macos/**/*.xib"]
literal = '((?:title|userLabel)=")([^"]*)(")'

# The AppleScript dictionary's names and descriptions.
[[strings]]
globs = ["macos/*.sdef"]
literal = '((?:title|name|description)=")([^"]*)(")'

# The same in the translations, so the translated strings still match.
[po]
globs = ["po/*.po", "po/*.pot"]
word = "Ghostty"

# --- the checks -----------------------------------------------------------

# After branding, no user-facing string in these places may name Ghostty or
# use its application id. Upstream adding one fails brand.py; add a rule.
# `allow` lists lines that may match anyway.

# Linux: the GTK app, the CLI, the build's identity, desktop files.
[[check]]
paths = ["src/apprt/gtk", "src/input/command.zig", "src/cli/version.zig",
         "src/build_config.zig", "src/build/GhosttyExe.zig",
         "src/build/GhosttyResources.zig", "src/build/GhosttyI18n.zig",
         "dist/linux"]
patterns = ['"[^"\n]*\bGhostty\b(?!\.\w)[^"\n]*"', "'[^'\n]*\bGhostty\b[^'\n]*'",
            'com\.mitchellh\.ghostty', '^Name=.*\bGhostty\b', '^Exec=ghostty\b']
allow = ['^\s*(//|#|\*)', 'log\.(debug|info|warn|err)', 'a fork of Ghostty',
         'based on Ghostty', 'dist/linux/com\.mitchellh\.ghostty\.metainfo\.xml\.in',
         '--copyright-holder=']   # xgettext's attribution of the strings: theirs

# macOS: strings in the app, its menus, AppleScript dictionary and Info.plist.
[[check]]
paths = ["macos/Sources", "macos/Ghostty.sdef", "macos/Ghostty-Info.plist"]
exts = [".swift", ".xib", ".sdef", ".plist"]
patterns = ['"[^"\n]*(?<!\()\bGhostty\b(?!\.\w)[^"\n]*"', '>[^<]*\bGhostty\b[^<]*<']
allow = ['^\s*(//|/\*|\*)', 'Logger\(', '<key>Ghostty', '<string>Ghostty\.sdef</string>',
         'customModule="Ghostty"']

# macOS: the app's identity in the Xcode project, and its update feed.
[[check]]
paths = ["macos/Ghostty.xcodeproj/project.pbxproj", "macos/Sources/Features/Update",
         "macos/Sources/Features/Custom App Icon/DockTilePlugin.swift"]
patterns = ['PRODUCT_BUNDLE_IDENTIFIER = "?com\.mitchellh\.ghostty\b',
            'CFBundleDisplayName = "?Ghostty', 'files\.ghostty\.org/appcast',
            'suiteName: "com\.mitchellh\.ghostty']
allow = []
